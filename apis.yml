name: D2iQ
description: >-
  D2iQ (formerly Mesosphere, maker of DC/OS) was an enterprise Kubernetes company
  whose flagship product, the D2iQ Kubernetes Platform (DKP), delivered production-grade
  Kubernetes cluster provisioning, day-2 operations, and application management across
  cloud, on-premises, edge, and air-gapped environments. D2iQ was acquired by Nutanix
  in early 2024; DKP was folded into and rebranded as the Nutanix Kubernetes Platform
  (NKP), which launched in May 2024. The independent D2iQ web and developer surfaces are
  now retired: d2iq.com redirects to nutanix.com/d2iq and docs.d2iq.com redirects to the
  Nutanix support portal, so D2iQ no longer operates a first-party public API, developer
  portal, or artifact surface of its own. This profile is retained as a historical /
  acquired-company record in the API Evangelist network.
